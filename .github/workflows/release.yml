name: Release

# Publishes ready-to-install zips for Chrome and Firefox on a GitHub release.
# It starts when:
#   - you push a tag such as `v0.0.3`,
#   - you publish a release in the GitHub web interface, or
#   - you run it by hand from the Actions tab (enter the tag).
# If the release already exists, the zips are added to it (or replaced).
# The tag must match the version in package.json.
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.0.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Run 'pnpm update-version <version>' first."
            exit 1
          fi

      - name: Build Chrome zip
        run: |
          pnpm build
          pnpm type-check
          pnpm test
          (cd dist && zip -qr "$GITHUB_WORKSPACE/vocabify-chrome.zip" .)

      - name: Build Firefox zip
        run: |
          pnpm build:firefox
          (cd dist && zip -qr "$GITHUB_WORKSPACE/vocabify-firefox.zip" .)

      - name: Publish release
        run: |
          repo="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          cat > install.md <<NOTES
          <!-- vocabify-install -->
          ## Install

          **Chrome, Edge, Brave:** download [vocabify-chrome.zip]($repo/vocabify-chrome.zip) and unzip it into a folder that you keep. Open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and select the folder.

          **Firefox:** download [vocabify-firefox.zip]($repo/vocabify-firefox.zip). Open \`about:debugging#/runtime/this-firefox\`, click **Load Temporary Add-on…** and select the zip. Firefox removes it when it closes.

          **Set up:** create a [WaniKani personal access token](https://www.wanikani.com/settings/personal_access_tokens) (read-only is sufficient), click the Vocabify icon, paste the token and reload the page.

          **Update:** replace the folder contents with the new zip and click the reload icon on the extension card.
          NOTES

          files="vocabify-chrome.zip vocabify-firefox.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading the zips to it."
            gh release upload "$TAG" $files --clobber
            body=$(gh release view "$TAG" --json body -q .body)
            if ! grep -q 'vocabify-install' <<<"$body"; then
              { cat install.md; echo; echo "$body"; } > notes.md
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" $files --title "Vocabify $TAG" \
              --notes-file install.md --generate-notes --verify-tag
          fi
